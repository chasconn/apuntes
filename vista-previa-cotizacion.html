<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa · Cotización</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
@page { size: A4; margin: 14mm; }
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#ffffff; --soft:#f6f8fc; --border:#e2e6f0; --line:#dde2ee;
  --txt:#171b2b; --muted:#5b6478; --accent:#1478A6; --accent2:#17A6A0; --accent-d:#0e5b7c;
  --grad: linear-gradient(120deg, #1478A6 0%, #17A6A0 100%);
  --red:#c62a40;
  --serif:'Playfair Display',Georgia,serif;
}
body{ background:#ececf3; color:var(--txt); font-family:'Inter',system-ui,sans-serif; font-size:13px; line-height:1.5; padding:24px; }
.sheet{ width:210mm; min-height:297mm; margin:0 auto; background:var(--bg); padding:16mm 16mm 14mm; box-shadow:0 8px 40px rgba(0,0,0,.18); position:relative; }
.toolbar{ width:210mm; margin:0 auto 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.toolbar button{ font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; border:none; border-radius:9px; padding:9px 16px; color:#fff; background:var(--grad); }
.toolbar a.button{ text-decoration:none; }
.toolbar button.alt{ background:#232a3d; }
.toolbar button.ds{ background:#0E5B7C; }
.toolbar .hint{ color:#56566a; font-size:12px; }

.head{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; padding-bottom:16px; border-bottom:2px solid var(--accent); }
.head img.logo{ height:78px; width:auto; max-width:120mm; display:block; margin:0 auto; object-fit:contain; }
.brand{ font-family:'Poppins',sans-serif; font-weight:700; font-size:12px; color:var(--txt); line-height:1.3; }
.brand small{ display:block; font-weight:500; font-size:9.5px; color:var(--muted); letter-spacing:.03em; }
.doctype{ text-align:center; }
/* Ficha: logo solo y grande al centro; "FICHA TÉCNICA + N°" en la esquina sup. derecha,
   uno al lado del otro, justo arriba de la línea del encabezado. */
.head--corner{ position:relative; }
.head--corner img.logo{ height:68px; }
.head--corner .doctype{ position:absolute; right:0; top:4px; text-align:right; }
.head--corner .doctype .t{ font-size:19px; }
.head--corner .doctype .meta{ margin-top:2px; font-size:12px; }
/* Banderas (Chile / USA) en la esquina superior izquierda del encabezado */
.head-flags{ position:absolute; left:0; top:8px; display:flex; gap:8px; align-items:center; }
.head-flags svg{ width:46px; height:auto; border:1px solid var(--border); border-radius:3px; display:block; }
.doctype .t{ font-family:var(--serif); font-weight:700; font-size:22px; color:var(--accent-d); letter-spacing:.01em; }
.doctype .meta{ font-size:11.5px; color:var(--muted); margin-top:3px; }

/* Panel de contacto (letterhead) en la parte superior de la cotización:
   contenido en un recuadro, organizado en columnas y compacto. */
.contactpanel{ margin-top:12px; background:var(--soft); border:1px solid var(--border); border-radius:9px; padding:8px 16px; font-size:10.5px; color:var(--txt); }
.cp-top{ display:flex; justify-content:space-between; gap:18px; align-items:flex-start; }
.cp-item{ display:flex; align-items:flex-start; gap:6px; }
.cp-item svg{ width:14px; height:14px; flex-shrink:0; margin-top:1px; }
.cp-item span{ line-height:1.4; }
.cp-divider{ border-top:1px solid var(--border); margin:7px 0; }
.cp-addr{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px 20px; color:var(--muted); }

.parties{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:14px; }
.box{ background:var(--soft); border:1px solid var(--border); border-radius:9px; padding:9px 12px; }
.box h3{ font-family:'Poppins',sans-serif; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-d); margin-bottom:6px; }
.box .f{ margin-bottom:4px; font-size:11px; }
.box .f b{ color:var(--muted); font-weight:600; font-size:9px; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:0; }

.items{ margin-top:22px; }
table{ width:100%; border-collapse:collapse; }
thead th{ font-family:'Poppins',sans-serif; font-weight:600; font-size:9px; letter-spacing:.04em; text-transform:uppercase; color:#fff; background:var(--accent-d); padding:9px 10px; text-align:left; }
thead th.num{ text-align:right; }
tbody td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:12.5px; }
tbody td.num{ text-align:right; font-family:'Poppins',sans-serif; font-weight:600; }
.itemimg{ width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--soft); }
.desc-main{ font-weight:700; }
.desc-sub{ color:var(--muted); font-size:11px; }
tbody tr:nth-child(even){ background:#fbfcfe; }

.totals{ margin-top:16px; margin-left:auto; width:280px; }
.totals .row{ display:flex; justify-content:space-between; padding:6px 2px; font-size:13px; color:var(--muted); }
.totals .row b{ color:var(--txt); }
.totals .grand{ margin-top:6px; border-top:2px solid var(--accent); padding-top:10px; }
.totals .grand span{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; color:var(--accent-d); text-transform:uppercase; letter-spacing:.03em; }
.totals .grand b{ font-size:19px; color:var(--accent-d); }

.cond{ margin-top:24px; }
.cond h3{ font-family:'Poppins',sans-serif; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-d); margin-bottom:8px; }
.cond-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px; }
.cond-grid .f b{ display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
.notes{ font-size:11.5px; color:var(--muted); border:1px dashed var(--border); border-radius:8px; padding:10px 12px; margin-top:8px; }

.foot{ margin-top:26px; border-top:1px solid var(--border); padding-top:12px; display:flex; justify-content:space-between; align-items:center; }
.foot .l{ font-size:11px; color:var(--muted); font-style:italic; max-width:62%; }
.foot .r{ font-family:'Poppins',sans-serif; font-size:11px; color:var(--accent-d); font-weight:600; }

/* Aviso legal */
.legalnotice{ background:#fdeceb; border:1px solid var(--red); color:var(--red); font-weight:700;
  font-size:11px; text-align:center; text-transform:uppercase; letter-spacing:.02em; line-height:1.5;
  padding:8px 14px; border-radius:8px; margin-bottom:14px; }
.legalnotice-foot{ margin-top:16px; margin-bottom:0; }

/* Datos de transferencia */
.bankbox{ background:var(--soft); border:1px solid var(--border); border-radius:0 0 8px 8px; padding:12px 14px; }
.bankbox .cond-grid{ margin-bottom:0; }

/* Franja de empresas cliente (pie de firma) */
.brandstrip{ margin-top:24px; border-top:1px solid var(--border); padding-top:14px; }
.brandstrip-title{ font-family:'Poppins',sans-serif; font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); text-align:center; margin-bottom:10px; }
.brandstrip-grid{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px 22px; }
.brandstrip-grid img{ max-height:26px; max-width:90px; object-fit:contain; filter:grayscale(0); }

/* Páginas de presentación (portada, términos, carta) del Documento Completo —
   formal y sobrio: sin marco ni fondo punteado de página completa. Una línea
   de acento fina, tipografía prolija y un watermark discreto en la esquina
   (guiño al mapa de puntos que Fluid Solutions ya usa a mano), sin banderas
   ni elementos vistosos. */
.sheet.premium{ position:relative; overflow:hidden; }
.sheet.premium::after{
  content:''; position:absolute; right:-10mm; bottom:-10mm; width:70mm; height:55mm; z-index:-1;
  background-image: radial-gradient(rgba(20,120,166,.5) 1px, transparent 1px);
  background-size: 6px 6px; opacity:.10; pointer-events:none;
}
.premium-topbar{ display:flex; align-items:center; gap:14px; padding-bottom:14px; border-bottom:1px solid var(--border); position:relative; z-index:1; }
.premium-topbar img.logo{ height:38px; width:auto; }
.premium-topbar .brand{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; color:var(--txt); }
.premium-topbar .brand small{ display:block; font-weight:500; font-size:10px; color:var(--muted); }
.premium-topbar .accent-line{ margin-left:auto; width:64px; height:3px; border-radius:3px; background:var(--accent-d); }
.premium-footbar{ position:relative; z-index:1; margin-top:26px; border-top:1px solid var(--border); padding-top:10px;
  text-align:center; font-family:'Poppins',sans-serif; font-size:10px; letter-spacing:.03em; color:var(--muted); }

/* Marca de agua muy tenue del logo, para las páginas propias del documento
   (portada, carta, cotización, términos) — detalle de papelería cuidada,
   deliberadamente casi imperceptible. */
.page-watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:-1; overflow:hidden; }
.page-watermark img{ width:60%; max-width:110mm; opacity:.045; filter:grayscale(1); }

/* Portada del documento completo */
.coversheet{ display:flex; flex-direction:column; height:255mm; }
.cover-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; }
.cover-mid .badge{ width:100%; max-width:130mm; height:2px; background:var(--accent-d); border-radius:2px; }
.cover-mid h1{ font-family:var(--serif); font-weight:700; font-size:38px; color:var(--accent-d); letter-spacing:.01em; }
.cover-mid .for{ font-family:'Poppins',sans-serif; font-weight:600; font-size:16px; color:var(--txt); }
.cover-mid .for span{ color:var(--accent-d); }
.cover-item{ margin-top:6px; background:var(--soft); border:1px solid var(--border); border-radius:10px;
  padding:14px 22px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:var(--accent-d); max-width:150mm; }
.cover-bottom{ text-align:center; font-size:11px; color:var(--muted); }

/* Términos y condiciones */
.termsblock{ margin-top:20px; }
.termsblock .title{ font-family:var(--serif); font-weight:700; font-size:22px; color:var(--txt); text-align:center; margin-bottom:18px; }
.termsblock .item{ margin-bottom:16px; }
.termsblock .item h4{ font-family:'Poppins',sans-serif; font-size:12.5px; color:var(--accent-d); margin-bottom:4px; }
.termsblock .item p{ font-size:12px; color:var(--txt); line-height:1.55; }
.termsblock .item a{ color:var(--accent-d); }
.ocbox{ margin-top:24px; background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:16px 20px; text-align:center; }
.ocbox h4{ font-family:'Poppins',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
.ocbox .name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--accent-d); }
.ocbox .l{ font-size:12px; color:var(--txt); margin-top:3px; }

/* Página separadora antes de cada datasheet de fabricante — da contexto de
   que lo que sigue es un anexo externo, en vez de que el datasheet aparezca
   de golpe con el diseño de otra marca. */
.anexosheet{ display:flex; flex-direction:column; height:255mm; position:relative; z-index:1; }
.anexo-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; }
.anexo-mid .kicker{ font-family:'Poppins',sans-serif; font-weight:600; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.anexo-mid .rule{ width:52px; height:2px; background:var(--accent-d); border-radius:2px; }
.anexo-mid h1{ font-family:var(--serif); font-weight:700; font-size:26px; color:var(--txt); max-width:150mm; }
.anexo-mid .item{ margin-top:4px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:var(--accent-d); }
.anexo-mid .note{ margin-top:18px; font-size:11px; color:var(--muted); max-width:120mm; }

/* Carta de presentación (opcional, por empresa) */
.letterblock{ margin-top:26px; font-size:12.5px; line-height:1.65; color:var(--txt); }
.letterblock .to{ margin-bottom:18px; }
.letterblock .to b{ display:block; }
.letterblock .asunto{ font-family:'Poppins',sans-serif; font-weight:700; margin:16px 0; }
.letterblock .asunto span{ font-weight:400; color:var(--accent-d); }
.letterblock p{ margin-bottom:14px; white-space:pre-wrap; }
.letterblock .sign{ margin-top:34px; text-align:center; }
.letterblock .sign b{ display:block; font-family:'Poppins',sans-serif; }

/* Ficha técnica */
.hero{ display:flex; gap:18px; margin-top:18px; }
.hero .photo{ width:70mm; height:56mm; border-radius:10px; background:var(--soft); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hero .photo img{ width:100%; height:100%; object-fit:cover; }
.hero .info h1{ font-family:var(--serif); font-weight:700; font-size:22px; color:var(--accent-d); margin-bottom:8px; }
.hero .info .meta{ font-size:11.5px; margin-bottom:4px; }
.hero .info .meta b{ color:var(--muted); font-weight:600; }
.hero .info .desc{ margin-top:10px; font-size:12px; color:var(--txt); line-height:1.55; }
.secblock{ margin-top:16px; }
.secblock h3{ font-family:'Poppins',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:#fff; background:var(--accent); padding:7px 10px; border-radius:6px 6px 0 0; }
.spectable{ width:100%; border-collapse:collapse; border:1px solid var(--border); border-top:none; }
.spectable td{ padding:7px 10px; font-size:12px; border-bottom:1px solid var(--border); }
.spectable tr:nth-child(even){ background:var(--soft); }
.spectable td.lbl{ font-weight:700; color:var(--accent-d); width:34%; }
/* Valores como recuadros de color (chips) con la paleta de Fluid, rotando 4 tonos */
.spectable td .chip{ display:inline-block; padding:3px 11px; border-radius:8px; font-weight:600; font-size:11.5px; line-height:1.35; }
.spectable td .chip-0{ background:#E3F5F2; color:#127C71; }
.spectable td .chip-1{ background:#E1F4FC; color:#1487BC; }
.spectable td .chip-2{ background:#E4EFF9; color:#1B5E96; }
.spectable td .chip-3{ background:#E8F6E9; color:#3C9440; }
/* Valor largo (descripción): a lo ancho de la hoja, texto normal, sin caja */
.spectable td.rowdesc, .spectable tr.rowdesc td{ }
.spectable .lbl-inline{ font-weight:700; color:var(--accent-d); }
.spectable .specdesc{ font-weight:400; color:var(--txt); font-size:12px; line-height:1.55; }
/* Sello FSBC Business Spa — solo en la ficha técnica, en su propia línea al pie */
.foot--note{ align-items:center; justify-content:center; }
.foot--note .l{ max-width:100%; width:100%; text-align:center; }
.fsbc-row{ margin-top:44mm; display:flex; justify-content:flex-end; align-items:center; }
.fsbc-row .fsbc-badge{ width:72mm; max-width:72mm; height:auto; display:block; object-fit:contain; }

/* Textura de puntillismo azul difuminado en esquinas diagonales (sup-izq / inf-der) */
.corner-dots{ position:absolute; width:60mm; height:52mm; z-index:0; pointer-events:none;
  background-image: radial-gradient(rgba(20,120,166,.65) 1.1px, transparent 1.7px);
  background-size: 7px 7px; opacity:.15; }
.corner-tl{ top:0; left:0;
  -webkit-mask-image: radial-gradient(135% 135% at 0 0, #000 20%, transparent 66%);
          mask-image: radial-gradient(135% 135% at 0 0, #000 20%, transparent 66%); }
.corner-br{ bottom:0; right:0;
  -webkit-mask-image: radial-gradient(135% 135% at 100% 100%, #000 20%, transparent 66%);
          mask-image: radial-gradient(135% 135% at 100% 100%, #000 20%, transparent 66%); }
.foot-contact{ display:block; margin-top:4px; font-style:normal; color:var(--accent-d); font-weight:600; }
.foot-mails{ display:block; margin-top:2px; font-style:normal; color:var(--accent-d); font-weight:600; }

/* Ficha que muestra el datasheet del fabricante embebido */
.sheet--ds{ min-height:auto; padding-bottom:12mm; }
.ds-title{ margin-top:16px; }
.ds-title h1{ font-family:var(--serif); font-weight:700; font-size:22px; color:var(--accent-d); margin-bottom:5px; }
.ds-meta{ font-size:12px; color:var(--muted); }
.ds-meta b{ color:var(--txt); font-weight:600; }
.ds-embed{ margin-top:14px; }
.ds-embed iframe{ width:100%; height:225mm; border:1px solid var(--border); border-radius:8px; background:#f6f8fc; display:block; }
.ds-note{ margin-top:10px; font-size:11px; color:var(--muted); font-style:italic; text-align:center; }

.loading, .errbox{ width:210mm; margin:60px auto; text-align:center; color:#666; font-size:14px; }

@media print{
  body{ background:#fff; padding:0; }
  .toolbar{ display:none; }
  .sheet{ box-shadow:none; width:auto; min-height:auto; padding:0; margin:0; }
}

</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <span class="hint" style="color:#b45309;font-weight:600">VISTA PREVIA · datos de ejemplo, no corresponden a un cliente real</span>
  <span class="hint" id="hint"></span>
</div>
<div id="content"></div>

<script>
function fmtCLP(n){ n = Math.round(Number(n)||0); return '$' + n.toLocaleString('es-CL'); }
function fmtDate(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// Barra de contacto (letterhead): se arma con los datos de Configuración de la empresa.
// Solo muestra lo que esté cargado (teléfonos, correos, Instagram, direcciones).
var CB_ICONS = {
  phone: '<svg class="cb-ic" viewBox="0 0 24 24" fill="#25D366"><path d="M20 15.5c-1.2 0-2.4-.2-3.5-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.2-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.6.2-1C8.7 6.4 8.5 5.2 8.5 4c0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>',
  mail: '<svg class="cb-ic" viewBox="0 0 24 24" fill="#C5221F"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
  ig: '<svg class="cb-ic" viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="#C13584" stroke="none"/></svg>',
  pin: '<svg class="cb-ic" viewBox="0 0 24 24" fill="#E24B4A"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>'
};
// Banderas Chile + USA para la esquina superior izquierda del encabezado.
var HEAD_FLAGS = '<div class="head-flags">'
  + '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect y="10" width="30" height="10" fill="#D52B1E"/><rect width="10" height="10" fill="#0039A6"/><path d="M5 2.3 L5.76 4.45 L8.04 4.51 L6.24 5.9 L6.88 8.09 L5 6.8 L3.12 8.09 L3.76 5.9 L1.96 4.51 L4.24 4.45 Z" fill="#fff"/></svg>'
  + '<svg viewBox="0 0 30 16"><rect width="30" height="16" fill="#fff"/><g fill="#B22234"><rect width="30" height="1.23"/><rect y="2.46" width="30" height="1.23"/><rect y="4.92" width="30" height="1.23"/><rect y="7.38" width="30" height="1.23"/><rect y="9.84" width="30" height="1.23"/><rect y="12.30" width="30" height="1.23"/><rect y="14.76" width="30" height="1.23"/></g><rect width="12" height="8.6" fill="#3C3B6E"/><g fill="#fff"><circle cx="2.4" cy="1.7" r=".5"/><circle cx="5" cy="1.7" r=".5"/><circle cx="7.6" cy="1.7" r=".5"/><circle cx="9.9" cy="1.7" r=".5"/><circle cx="3.7" cy="3.3" r=".5"/><circle cx="6.3" cy="3.3" r=".5"/><circle cx="8.8" cy="3.3" r=".5"/><circle cx="2.4" cy="4.9" r=".5"/><circle cx="5" cy="4.9" r=".5"/><circle cx="7.6" cy="4.9" r=".5"/><circle cx="9.9" cy="4.9" r=".5"/><circle cx="3.7" cy="6.5" r=".5"/><circle cx="6.3" cy="6.5" r=".5"/><circle cx="8.8" cy="6.5" r=".5"/></g></svg>'
  + '</div>';

function buildContactBar(s){
  var phones = [s.company_phone, s.company_phone2].filter(Boolean);
  var emails = [s.company_email, s.company_email2].filter(Boolean);
  var addrs  = [s.company_address, s.company_address2, s.company_address3].filter(Boolean);
  var top = '';
  if (phones.length) top += '<div class="cp-item">'+CB_ICONS.phone+'<span>'+phones.map(esc).join('<br>')+'</span></div>';
  if (emails.length) top += '<div class="cp-item">'+CB_ICONS.mail+'<span>'+emails.map(esc).join('<br>')+'</span></div>';
  if (s.company_instagram) top += '<div class="cp-item">'+CB_ICONS.ig+'<span>@'+esc(String(s.company_instagram).replace(/^@/,''))+'</span></div>';
  var addrHtml = '';
  if (addrs.length) addrHtml = '<div class="cp-addr">'+addrs.map(function(a){ return '<div class="cp-item">'+CB_ICONS.pin+'<span>'+esc(a)+'</span></div>'; }).join('')+'</div>';
  if (!top && !addrHtml) return '';
  var html = '<div class="contactpanel">';
  if (top) html += '<div class="cp-top">'+top+'</div>';
  if (top && addrHtml) html += '<div class="cp-divider"></div>';
  html += addrHtml;
  html += '</div>';
  return html;
}
