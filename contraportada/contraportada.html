<title>Contraportada · Felices para siempre</title>
<style>
  :root{
    --sky:#8ED2F4; --sky-deep:#2E7FC2; --navy:#173B6B;
    --leaf:#4CA82E; --leaf-deep:#1F7A34;
    --gold:#FFC93C; --gold-deep:#EF9A1E;
    --cream:#FFFDF6; --cream-2:#FFF4DE;
    --ink:#22443B; --muted:#6E7B63;
    --pink:#FF6FA6; --orange:#FF9A3D; --purple:#A472D6;
    --dot:#CDB88C;
    --title-fill:#E4F5FF;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #BFE7FB 0%, rgba(191,231,251,0) 55%),
      linear-gradient(180deg,#A9DDF6 0%, #CFEFC7 48%, #A7D98C 100%);
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:28px 16px 48px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ---- botón imprimir / guardar ---- */
  .printbtn{
    position:fixed; top:16px; right:16px; z-index:50;
    font-family:"Nunito",sans-serif; font-weight:800; font-size:15px;
    color:var(--navy); background:linear-gradient(180deg,#FFE07A,var(--gold));
    border:2px solid #fff; border-radius:999px;
    padding:11px 18px; cursor:pointer;
    box-shadow:0 8px 20px rgba(23,59,107,.28);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .printbtn:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(23,59,107,.34)}
  .printbtn:active{transform:translateY(0)}
  .printbtn:focus-visible{outline:3px solid var(--sky-deep); outline-offset:2px}

  /* ---- la hoja (carta vertical) ---- */
  .sheet{
    position:relative;
    width:min(94vw, 800px);
    aspect-ratio:8.5/11;
    container-type:inline-size;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(23,59,107,.35), 0 4px 14px rgba(0,0,0,.15);
    isolation:isolate;
  }

    background-size:cover; background-position:center;
    transform:scale(1.06);
  }
  .wash{
    position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(120% 60% at 50% -6%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(150,208,244,.42) 0%, rgba(255,246,228,.20) 46%, rgba(60,150,50,.42) 100%);
  }

  /* ---- flores y mariposa ---- */
  .deco{position:absolute; z-index:3; pointer-events:none}
  .flor{width:13cqw; height:13cqw; filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
  .f-tl{top:1.6cqw; left:1.6cqw; color:var(--pink); transform:rotate(-8deg)}
  .f-tr{top:1.6cqw; right:1.6cqw; color:var(--purple); transform:rotate(10deg)}
  .f-bl{bottom:1.4cqw; left:1.4cqw; width:11cqw; height:11cqw; color:var(--orange); transform:rotate(6deg)}
  .f-br{bottom:1.4cqw; right:1.4cqw; width:11cqw; height:11cqw; color:var(--sky); transform:rotate(-6deg)}
  .bfly{top:3.6cqw; right:15.5cqw; width:8.5cqw; height:8.5cqw; color:var(--gold-deep);
        transform-origin:center; animation:flutter 5.5s ease-in-out infinite}
  @keyframes flutter{
    0%,100%{transform:translateY(0) rotate(-6deg)}
    50%{transform:translateY(-6px) rotate(6deg)}
  }

  /* ---- tarjeta principal ---- */
  .card{
    position:absolute; inset:0; z-index:2;
    margin:4.4cqw;
    background:linear-gradient(180deg, rgba(255,255,255,.975), rgba(255,253,246,.965));
    border:1.1cqw solid #fff;
    border-radius:22px;
    box-shadow:0 12px 30px rgba(23,59,107,.20), inset 0 0 0 1px rgba(255,255,255,.6);
    padding:4.4cqw 5.6cqw 2.9cqw;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .sun{
    position:absolute; top:-13cqw; left:50%; transform:translateX(-50%);
    width:68cqw; height:50cqw; z-index:-1;
    background:radial-gradient(closest-side, rgba(255,201,60,.55), rgba(255,201,60,.14) 55%, rgba(255,201,60,0) 72%);
  }

  .eyebrow{
    margin:0 0 .25cqw; text-align:center;
    font-weight:800; font-size:2.4cqw; letter-spacing:.12em; text-transform:uppercase;
    color:var(--leaf-deep);
  }
  .title{
    margin:0; text-align:center; text-wrap:balance;
    font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:8.3cqw; line-height:.88; letter-spacing:.4px;
    color:var(--title-fill);
    -webkit-text-stroke:min(.9cqw,6px) var(--navy);
    paint-order:stroke fill;
    text-shadow:0 .55cqw 0 rgba(23,59,107,.22);
  }
  .subtitle{
    margin:.5cqw 0 0; text-align:center;
    font-family:"Caveat",cursive; font-weight:700; font-size:5cqw; line-height:1;
    color:var(--sky-deep);
  }
  .verse{
    margin:.8cqw auto 0; max-width:90%; text-align:center;
    font-style:italic; font-weight:600; font-size:2.5cqw; line-height:1.35;
    color:var(--muted);
  }
  .verse b{color:var(--leaf-deep); font-style:normal}

  .animals{
    text-align:center; font-size:4cqw; letter-spacing:.5cqw;
    margin:.6cqw 0 .7cqw;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));
  }

  /* ---- campos ---- */
  .ficha{
    display:grid; grid-template-columns:1fr 1fr;
    gap:2.3cqw 5cqw; margin:0;
  }
  .full{grid-column:1 / -1}
  .field{display:flex; flex-direction:column; gap:.5cqw; min-width:0}
  .flabel{
    font-weight:800; font-size:2.3cqw; letter-spacing:.07em; text-transform:uppercase;
    color:var(--navy);
  }
  .flabel::before{content:"✦ "; color:var(--gold-deep)}
  .fin{
    font-family:"Caveat",cursive; font-weight:700;
    font-size:4.4cqw; line-height:1.1; color:var(--sky-deep);
    border:none; border-bottom:.42cqw dotted var(--dot);
    background:transparent; padding:.3cqw .4cqw .7cqw; width:100%;
    transition:border-color .15s ease, background .15s ease;
  }
  .fin::placeholder{font-family:"Nunito",sans-serif; font-weight:600; font-size:2.55cqw; color:#B9AE97}
  .fin:focus{outline:none; border-bottom-color:var(--pink); background:linear-gradient(transparent 62%, #FFF0A8 62%)}
  .fin:focus-visible{border-radius:6px 6px 0 0; box-shadow:0 3px 0 -1px var(--pink)}
  .field.big .flabel{font-size:2.6cqw; color:var(--leaf-deep)}
  .field.big .fin{font-size:5.7cqw; color:var(--navy); border-bottom-width:.55cqw}

  /* ---- listón "si me encuentras" ---- */
  .lost{
    margin-top:auto;
    display:flex; align-items:center; gap:2cqw;
    background:linear-gradient(180deg,#FFE68A,var(--gold));
    border:.7cqw solid #fff;
    border-radius:16px;
    padding:1.5cqw 2.6cqw;
    box-shadow:0 6px 14px rgba(239,154,30,.3);
  }
  .lost-ic{font-size:5cqw; line-height:1}
  .lost-tx{font-weight:800; font-size:2.6cqw; line-height:1.2; color:var(--navy)}
  .lost-body{display:flex; flex-direction:column; gap:.4cqw; flex:1}
  .lost-call{font-weight:800; font-size:2.6cqw; color:var(--navy); white-space:nowrap}
  .fin.inline{
    display:inline-block; width:auto; min-width:22cqw;
    border-bottom-color:rgba(23,59,107,.5); color:var(--navy);
    font-size:4cqw; padding-bottom:.2cqw;
  }
  .fin.inline::placeholder{color:rgba(23,59,107,.45)}
  .fin.inline:focus{background:linear-gradient(transparent 62%, rgba(255,255,255,.7) 62%); border-bottom-color:var(--navy)}

  .foot{
    text-align:center; margin:1.2cqw 0 0;
    font-weight:700; font-size:2cqw; color:var(--muted);
  }
  .foot .heart{color:var(--pink)}

  @media (max-width:520px){ .verse{max-width:96%} }

  @media (prefers-reduced-motion:reduce){
    .bfly{animation:none}
    .printbtn{transition:none}
  }

  /* ---- impresión ---- */
  @media print{
    @page{size:letter portrait; margin:0}
    html,body{background:#fff !important; padding:0; margin:0; display:block}
    .no-print{display:none !important}
    .sheet{
      width:8.5in; height:11in; max-width:none;
      border-radius:0; box-shadow:none; margin:0 auto;
      aspect-ratio:auto;
    }
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>

<button class="printbtn no-print" type="button" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>

<main class="sheet">
  <div class="bg" aria-hidden="true"></div>
